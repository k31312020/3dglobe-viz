        <h2>How are surfaces are drawn?</h2>
        <p>
          All objects around us including ourselves are made up of surfaces.
          Well lets say infinite number of surfaces because we dont find objects
          with perfect sharp edges in real life. The infinitely stiched together
          surfaces is effortless for us human beings to comprehend but for your
          computer it has to rely on approximation of reality. If we want to
          draw a simple flat triangle in space we need the three vertexes A,B
          and C. The algorithm underneath will for each frame fill the projected
          triangle on the 2D screen with pixels based on the camera angle. Now
          this happens at a much lower level, what we want at the moment is to
          be able to darw surfaces on the screen so we will not bother with this
          detail. And we can skip all the fundamental detials using threejs
          which hides this implementation and allows us to draws surfaces
          easily. The code snippet below on the left shows how you can draw a
          triangle in space using threejs. The resulting render for this code is
          on the right side.
        </p>

                const {A,B,C} = points;

                const vertices = new Float32Array([
                  A.x, A.y, A.z,
                  B.x, B.y, B.z,
                  C.x, C.y, C.z,
                ]);

                geometry.setAttribute(
                  "position",
                  new THREE.BufferAttribute(vertices, 3)

                const material = new THREE.MeshBasicMaterial({
                  color: 0xfff000,
